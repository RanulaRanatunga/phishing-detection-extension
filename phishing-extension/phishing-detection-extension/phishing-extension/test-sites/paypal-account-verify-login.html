<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f5f7; margin: 0; }
        .header { background: #131921; color: #fff; padding: 14px 24px; font-weight: 700; }
        .header small { font-weight: 400; color: #c8d1da; }
        .container { max-width: 980px; margin: 24px auto; display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
        .panel { background: #fff; border: 1px solid #d9dfe6; border-radius: 8px; padding: 18px; }
        h1 { margin: 0 0 8px; color: #1f2933; }
        .muted { color: #667; font-size: 13px; }
        .section-title { margin-top: 14px; font-size: 15px; color: #1f2933; font-weight: 700; }
        .field { margin-top: 10px; }
        .field label { display: block; font-size: 13px; color: #2c3e50; margin-bottom: 4px; }
        .field input, .field select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #c6ced8; border-radius: 4px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pay-btn { width: 100%; margin-top: 14px; padding: 11px; border: none; border-radius: 4px; color: #fff; background: #2b7de9; cursor: pointer; }
        .items { margin-top: 10px; }
        .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        .total { display: flex; justify-content: space-between; padding-top: 10px; font-weight: 700; }
        .badge { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 999px; background: #e8f0fe; color: #174ea6; font-size: 12px; }
        @media (max-width: 780px) { .container { grid-template-columns: 1fr; margin: 12px; } }
    </style>
</head>
<body>
    <div class="header">
        FastCart Checkout
        <small> - secure order payment</small>
    </div>

    <div class="container">
        <div class="panel">
            <h1>Complete your order</h1>
            <p class="muted">Your cart is reserved for 09:58. Please confirm billing details to avoid cancellation.</p>

            <div class="section-title">Billing details</div>
            <div class="field">
                <label>Full name</label>
                <input type="text" placeholder="Cardholder name">
            </div>
            <div class="field">
                <label>Bank name</label>
                <input type="text" placeholder="Bank name">
            </div>
            <div class="field">
                <label>Card number</label>
                <input type="text" placeholder="0000 0000 0000 0000">
            </div>
            <div class="row">
                <div class="field">
                    <label>Expiry</label>
                    <input type="text" placeholder="MM/YY">
                </div>
                <div class="field">
                    <label>CVV</label>
                    <input type="text" placeholder="123">
                </div>
            </div>
            <div class="field">
                <label>Billing postcode</label>
                <input type="text" placeholder="Postcode">
            </div>

            <button class="pay-btn" onclick="alert('Payment submitted. Reference: ORD-9742')">Pay now</button>
        </div>

        <div class="panel">
            <h3 style="margin-top:0;">Order summary</h3>
            <div class="items">
                <div class="item"><span>Noise Cancelling Headphones</span><span>149.00</span></div>
                <div class="item"><span>Express Shipping</span><span>7.99</span></div>
                <div class="item"><span>Tax</span><span>12.48</span></div>
            </div>
            <div class="total"><span>Total</span><span>169.47</span></div>
            <span class="badge">Address verification required</span>
        </div>
    </div>
</body>
</html>
