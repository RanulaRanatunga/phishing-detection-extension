<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Review</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f5f7; padding: 24px; }
        .box { max-width: 520px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        button { padding: 10px 14px; border: none; background: #1a73e8; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Document review request</h1>
        <p>A shared document is waiting for your review.</p>
        <button onclick="alert('Document opened in preview mode.')">Open document</button>
    </div>
</body>
</html>
